<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Portal — MJ Web Solutions</title>
<meta name="description" content="Client portal for MJ Web Solutions — track projects, messages, invoices and request quotes." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<style>
:root{
  --bg:#FFFFFF;
  --bg-soft:#F8FAFC;
  --card:#FFFFFF;
  --text:#1a2030;
  --muted:#5a6478;
  --accent:#2563EB;
  --accent2:#1d4ed8;
  --accent-soft:rgba(37,99,235,0.10);
  --red:#EF4444;
  --green:#10B981;
  --amber:#F59E0B;
  --line:#E5E7EB;
  --shadow:0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg:0 12px 28px rgba(15,23,42,0.12);
  --radius:10px;
  --nav-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:var(--bg-soft);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
a{color:var(--accent);text-decoration:none}
.hidden{display:none !important}

/* ---------- Ambient background blobs ---------- */
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.blob.b1{width:340px;height:340px;background:rgba(37,99,235,.16);top:-90px;left:-110px}
.blob.b2{width:280px;height:280px;background:rgba(16,185,129,.12);top:32%;right:-120px}
.blob.b3{width:300px;height:300px;background:rgba(37,99,235,.10);bottom:-100px;left:22%}

/* ---------- Gate / loader ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200;flex-direction:column;gap:16px}
.dots{display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:99px;background:var(--accent);animation:wave 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.1s}
.dots span:nth-child(3){animation-delay:.2s}
.dots span:nth-child(4){animation-delay:.3s}
.dots span:nth-child(5){animation-delay:.4s}
.dots.sm span{width:6px;height:6px;background:currentColor}
@keyframes wave{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}}
.gate-msg{color:var(--muted);font-size:13px}

/* ---------- Layout ---------- */
#app{min-height:100dvh;position:relative;z-index:1}
.sidebar{display:none}
.main{padding:0 0 calc(var(--nav-h) + 28px);min-height:100dvh}

.screen-head{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:14px 16px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;
}
.screen-head h1{font-size:18px}
.screen-head .sub{font-size:11.5px;color:var(--muted)}
.pad{padding:16px}

/* profile avatar button (top-right, every screen) */
.avbtn{
  width:40px;height:40px;border-radius:99px;flex:none;
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;
  display:grid;place-items:center;box-shadow:var(--shadow);
  border:2px solid rgba(255,255,255,.9);
}
.avbtn:active{transform:scale(.96)}

/* ---------- Glass cards ---------- */
.glass{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:13px 12px;display:flex;flex-direction:column;gap:6px}
.stat i{font-size:19px;color:var(--accent);background:var(--accent-soft);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.stat .lbl{font-size:11px;color:var(--muted);line-height:1.3}
.stat .val{font-size:21px;font-weight:700;letter-spacing:-0.02em}

.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}

.list{display:flex;flex-direction:column;gap:10px}
.row{
  width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  gap:12px;align-items:center;padding:12px 14px;min-height:56px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
}
.row:active{background:var(--bg-soft)}
.row .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:18px;flex:none}
.row .t{font-size:13.5px;font-weight:500}
.row .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ts{font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
.min0{min-width:0}

.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty i{font-size:30px;color:var(--accent);opacity:.55;display:block;margin:0 auto 10px}
.empty .e-t{font-weight:600;color:var(--text);font-size:14px;margin-bottom:4px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.b-quote_sent,.b-pending{background:#F1F5F9;color:#64748B}
.b-approved,.b-partial{background:rgba(245,158,11,.14);color:#B45309}
.b-in_progress{background:var(--accent-soft);color:var(--accent)}
.b-delivered,.b-paid{background:rgba(16,185,129,.14);color:#047857}
.b-unpaid,.b-declined{background:rgba(239,68,68,.12);color:#B91C1C}

/* ---------- Controls ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 2px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.8);backdrop-filter:blur(8px);font-size:12.5px;color:var(--muted);font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.28)}
.field{width:100%;padding:12px 13px;min-height:46px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{min-height:88px;resize:vertical;line-height:1.5}
label.lb{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:0 0 6px}
.fgroup{margin-bottom:14px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:var(--radius);
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;
  transition:background .15s,transform .1s;box-shadow:0 6px 16px rgba(37,99,235,.24);
}
.btn:hover{background:var(--accent2)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.7;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.danger{background:var(--red);box-shadow:0 6px 16px rgba(239,68,68,.22)}
.btn.sm{min-height:40px;font-size:13px;padding:0 14px}
.btn.full{width:100%}
.btn-row{display:flex;gap:12px}
.btn-row>*{flex:1}
.icon-btn{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;font-size:20px;color:var(--text)}
.icon-btn:hover{background:var(--bg-soft)}

/* ---------- Bottom nav (3 tabs, glass pill) ---------- */
.bnav{
  position:fixed;left:14px;right:14px;bottom:14px;z-index:80;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(37,99,235,.18);border-radius:999px;box-shadow:var(--shadow-lg);
  padding:6px 4px;
}
.bnav button{
  min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);border-radius:999px;padding:4px 2px;position:relative;
}
.bnav button i{font-size:20px}
.bnav button span{font-size:9.5px;font-weight:500;line-height:1.1;text-align:center}
.bnav button.on{color:var(--accent)}
.bnav button.on i{font-weight:700}
.bnav .navdot{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;border-radius:99px;background:var(--accent);border:2px solid #fff}

/* ---------- Screen transitions ---------- */
.screen{animation:fadeUp .18s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 7px rgba(37,99,235,0)}}

/* ---------- Sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:120;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:130;
  background:var(--card);border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);
  max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  touch-action:none;
}
.sheet.on{transform:translateY(0)}
.sheet .grab{padding:10px 0 4px;display:grid;place-items:center;flex:none;cursor:grab}
.sheet .grab i{display:block;width:42px;height:5px;border-radius:99px;background:var(--line)}
.sheet .sh-head{padding:4px 18px 10px;flex:none}
.sheet .sh-head h3{font-size:16px}
.sheet .sh-body{padding:6px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}

/* ---------- Toast ---------- */
#toasts{position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + 30px);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:#111827;color:#fff;padding:12px 14px;border-radius:var(--radius);font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:fadeUp .18s ease-out;
}
.toast.err{background:var(--red)}
.toast.ok i{color:#6EE7B7}

/* ---------- Project cards ---------- */
.pcard{display:block;width:100%;text-align:left;padding:14px;position:relative;
  background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pcard:active{background:var(--bg-soft)}
.pcard .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.pcard .nm{font-size:15px;font-weight:600;line-height:1.3}
.pcard .cl{font-size:12.5px;color:var(--muted);margin-top:2px}
.pcard .ft{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:11.5px;color:var(--muted);align-items:center}
.pcard .amt{font-weight:600;color:var(--text);font-size:13px}
.pcard .udot{position:absolute;right:12px;bottom:12px}

.dot{width:9px;height:9px;border-radius:99px;background:var(--accent)}
.unread-pill{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}

/* ---------- Journey timeline ---------- */
.tl{position:relative;padding-left:30px}
.tl-item{position:relative;padding:0 0 26px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-22px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child:before{display:none}
.tl-item.done:before{background:var(--accent)}
.tl-item.cur:before{background-image:linear-gradient(var(--line) 55%, transparent 45%);background-size:2px 9px;background-color:transparent}
.tl-dot{position:absolute;left:-30px;top:0;width:18px;height:18px;border-radius:99px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted)}
.tl-item.done .tl-dot{border-color:var(--accent);background:var(--accent);color:#fff}
.tl-item.cur .tl-dot{width:22px;height:22px;left:-32px;top:-2px;border-color:var(--accent);background:var(--accent);color:#fff;animation:pulseGlow 2.2s infinite}
.tl-item .tl-t{font-size:13.5px;font-weight:500;color:var(--muted)}
.tl-item.done .tl-t{color:var(--text)}
.tl-item.cur .tl-t{font-weight:700;color:var(--text);font-size:14px}
.tl-item .tl-s{font-size:11.5px;color:var(--muted)}
.tl-log{margin-top:10px;display:flex;flex-direction:column;gap:8px}

.note-item{padding:11px 12px;background:rgba(248,250,252,.85);border:1px solid var(--line);border-radius:var(--radius);font-size:13px}
.note-item .n-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center}
.hint{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-bottom:10px}
.hint i{color:var(--accent);font-size:14px;margin-top:1px}

/* ---------- Messages ---------- */
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;min-height:64px;width:100%;text-align:left;
  background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mrow:active{background:var(--bg-soft)}
.av{width:42px;height:42px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}

#thread{position:fixed;inset:0;z-index:100;background:var(--bg-soft);display:flex;flex-direction:column}
#thread .th-head{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#thread .th-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
#thread .th-comp{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
#thread .th-comp textarea{min-height:44px;max-height:120px;resize:none}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);word-wrap:break-word;white-space:pre-wrap}
.bub.them{align-self:flex-start;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:1px solid var(--line);border-bottom-left-radius:5px;position:relative;padding-left:34px}
.bub.them:before{content:"MJ";position:absolute;left:6px;top:8px;width:20px;height:20px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:8px;font-weight:700;display:grid;place-items:center}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.bub .bt{font-size:10.5px;opacity:.7;margin-top:4px;text-align:right}
.daysep{align-self:center;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 11px;border-radius:99px;margin:8px 0}

.linkish{color:var(--accent);font-size:12px;font-weight:500;padding:6px 0;min-height:32px;display:inline-flex;align-items:center;gap:5px}

/* ---------- Hero (Home) ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:16px;padding:20px 18px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  color:#fff;box-shadow:var(--shadow-lg);
}
.hero:after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:before{content:"";position:absolute;right:44px;bottom:-64px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .h-greet{font-size:12px;opacity:.85}
.hero .h-name{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-0.01em}
.hero .h-sub{font-size:12px;opacity:.85;margin-top:8px;max-width:76%}
.hero .btn{margin-top:14px;background:#fff;color:var(--accent);box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative;z-index:1}
.hero .btn:hover{background:#F1F5F9}

.aproj{padding:16px}
.aproj .stage-line{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.aproj .stage-line i{color:var(--accent)}
.aproj .latest{margin-top:10px}

/* ---------- Desktop ---------- */
@media (min-width:1024px){
  :root{--nav-h:0px}
  .bnav{display:none}
  .sidebar{
    display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;
    background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:20px 14px;z-index:70;
  }
  .sidebar .brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px}
  .sidebar .brand .lg{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
  .sidebar .brand b{font-size:14px}
  .sidebar .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .sidebar nav button{display:flex;align-items:center;gap:11px;min-height:46px;padding:0 12px;border-radius:var(--radius);color:var(--muted);font-size:13.5px;font-weight:500;text-align:left;position:relative}
  .sidebar nav button i{font-size:19px}
  .sidebar nav button:hover{background:var(--bg-soft)}
  .sidebar nav button.on{background:var(--accent-soft);color:var(--accent)}
  .sidebar nav button .navdot{position:static;margin-left:auto;border:none}
  .sidebar .who{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .sidebar .who .me{display:flex;gap:10px;align-items:center;padding:0 4px;min-width:0}
  .sidebar .who .me .nmm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar .who .me .rl{font-size:11px;color:var(--muted)}
  .main{margin-left:240px;padding-bottom:40px}
  .pad{padding:24px 28px;max-width:960px}
  .screen-head{padding:18px 28px}
  .screen-head h1{font-size:22px}
  .stat-grid{gap:16px;max-width:560px}
  .chips{margin:0;padding:0}
  #toasts{left:auto;right:24px;bottom:24px;width:340px}
  .scrim{background:rgba(15,23,42,.5)}
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;width:min(520px,92vw);
    border-radius:16px;transform:translate(-50%,-46%) scale(.97);opacity:0;
    transition:opacity .18s ease,transform .18s ease;max-height:86vh;
  }
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet .grab{display:none}
  .sheet .sh-head{padding:18px 22px 8px}
  .sheet .sh-body{padding:0 22px 22px}
  #thread{left:240px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
}
@media (min-width:1280px){
  #thread{position:static;height:auto;min-height:100dvh}
}
</style>
</head>
<body>

<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="gate">
  <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="gate-msg" id="gateMsg">Verifying your session…</div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="lg">MJ</div>
      <div><b>MJ Web Solutions</b><small>Client portal</small></div>
    </div>
    <nav id="sideNav"></nav>
    <div class="who">
      <div class="me">
        <div class="av" id="sideAv">C</div>

function timeAgo(iso){
  if(!iso) return "";
  const d = new Date(iso), s = (Date.now()-d.getTime())/1000;
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  if(s<604800) return Math.floor(s/86400)+"d ago";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
const fmtDate = (iso)=> iso ? new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
const fmtTime = (iso)=> iso ? new Date(iso).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) : "";
function dayLabel(iso){
  const d=new Date(iso), t=new Date(), y=new Date(Date.now()-864e5);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,t)) return "Today";
  if(same(d,y)) return "Yesterday";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}

const FILTER_PILLS = [["all","All"],["quote_sent","Pending"],["in_progress","In Progress"],["delivered","Delivered"]];
function filterMatch(p){
  if(S.pFilter==="all") return true;
  if(S.pFilter==="quote_sent") return p.status==="quote_sent"||p.status==="approved";
  return p.status===S.pFilter;
}
function hasUnseenUpdate(p){
  return S.messages.some(m=>m.project_id===p.id && m.sender_id!==S.me.id && !m.read);
}
function payStatus(p){
  const invs = S.invoices.filter(i=>i.project_id===p.id);
  if(!invs.length) return null;
  if(invs.every(i=>i.payment_status==="paid")) return "paid";
  if(invs.some(i=>i.payment_status==="partial")) return "partial";
  return "unpaid";
}
function viewProjects(){
  const list = S.projects.filter(filterMatch);
  return `${head("My Projects", `${S.projects.length} project${S.projects.length===1?"":"s"}`)}
  <div class="pad screen">

          <i class="ph ph-rocket-launch"></i>

          ${S.pFilter==="all"?"Request a quote to get started — it only takes a minute.":""}

        ${S.pFilter==="all"?`<button class="btn full" style="margin-top:12px" onclick="openQuoteForm()"><i class="ph-bold ph-plus"></i> Request a New Quote</button>`:""}`}

  </div>`;
}

  const visibleUpdates = showAll ? curUpdates : curUpdates.slice(0,3);
  const invs = S.invoices.filter(i=>i.project_id===p.id);

  return `${head(p.name, "Project details")}
  <div class="pad screen">
    <button class="linkish" onclick="go('projects')" style="margin-bottom:10px"><i class="ph ph-arrow-left"></i> All projects</button>

    <div class="card" style="padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div>
        <div style="font-size:11.5px;color:var(--muted)">Quote amount</div>

            <div class="tl-s">${i<curIdx?"Completed":i===curIdx?"Happening now":"Upcoming"}</div>
            ${i===curIdx?`
              <div class="tl-log">
                ${visibleUpdates.length?visibleUpdates.map(u=>`
                  <div class="note-item">${esc(u.note||"")}<div class="n-meta"><i class="ph ph-clock"></i>${esc(fmtDate(u.created_at))} · ${esc(timeAgo(u.created_at))}</div></div>
                `).join(""):`<div class="hint"><i class="ph ph-info"></i><span>No updates logged for this stage yet — check back soon.</span></div>`}
                ${curUpdates.length>3?`<button class="linkish" onclick="S.showAllUpdates['${p.id}']=${!showAll};render()">${showAll?"Show fewer updates":`Show more updates (${curUpdates.length-3} more)`}</button>`:""}

              <div style="font-weight:600;font-size:13.5px">${esc(i.description||"Invoice")}</div>
              <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(fmtDate(i.created_at))}</div>
            </div>
            ${badge(i.payment_status)}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px">

            ${i.pdf_url?`<a class="btn sm ghost" href="${esc(i.pdf_url)}" target="_blank" rel="noopener"><i class="ph-bold ph-download-simple"></i> Download Invoice</a>`:""}

/* ---------- Screen 3: Messages ---------- */
function conversations(){
  const map = {};
  S.messages.forEach(m=>{
    if(!project(m.project_id)) return;
    if(!map[m.project_id]) map[m.project_id] = { project_id:m.project_id, last:m, unread:0 };
    if(new Date(m.created_at) > new Date(map[m.project_id].last.created_at)) map[m.project_id].last = m;
    if(m.sender_id!==S.me.id && !m.read) map[m.project_id].unread++;
  });
  return Object.values(map).sort((a,b)=> new Date(b.last.created_at)-new Date(a.last.created_at));
}
function viewMessages(){
  const convs = conversations();
  return `${head("Messages", `${convs.reduce((s,c)=>s+c.unread,0)} unread`)}
  <div class="pad screen">
    <div class="list">
      ${convs.length?convs.map(c=>{
        const p = project(c.project_id);
        return `<button class="mrow" onclick="openThread('${c.project_id}')">
          <span class="av">${esc(initials(p.name))}</span>
          <span class="min0">
            <span style="display:flex;gap:8px;justify-content:space-between"><span class="t" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="ts">${esc(timeAgo(c.last.created_at))}</span></span>
            <span class="s" style="display:block">${c.last.sender_id===S.me.id?"You: ":"MJ: "}${esc(c.last.content)}</span>
          </span>
          ${c.unread?`<span class="unread-pill">${c.unread}</span>`:`<span></span>`}
        </button>`;}).join("")
      :`<div class="empty glass"><i class="ph ph-chats-circle"></i><div class="e-t">No conversations yet</div>Open a project and tap “Open Chat” to message MJ directly.</div>`}
    </div>
    ${S.projects.filter(p=>!convs.some(c=>c.project_id===p.id)).length?`
    <div class="section-title">Start a conversation</div>
    <div class="list">
      ${S.projects.filter(p=>!convs.some(c=>c.project_id===p.id)).map(p=>`
        <button class="row" onclick="openThread('${p.id}')">
          <span class="ico"><i class="ph ph-chat-circle"></i></span>
          <span class="min0"><span class="t" style="display:block">${esc(p.name)}</span><span class="s" style="display:block">${esc(labelize(p.status))}</span></span>
          <span class="ts"><i class="ph ph-caret-right"></i></span>
        </button>`).join("")}
    </div>`:""}
  </div>`;
}

async function openThread(pid){
  S.threadProjectId = pid;
  $("#bnav").classList.add("hidden");
  $("#thread").classList.remove("hidden");
  renderThread();
  const unread = S.messages.filter(m=>m.project_id===pid && m.sender_id!==S.me.id && !m.read).map(m=>m.id);
  if(unread.length){
    await sb.from("messages").update({ read:true }).in("id", unread);
    S.messages.forEach(m=>{ if(unread.includes(m.id)) m.read = true; });
    renderNav();
  }
}
function closeThread(){
  S.threadProjectId = null;
  $("#thread").classList.add("hidden");
  $("#bnav").classList.remove("hidden");
  renderNav();
  render();
}
function renderThread(){
  const pid = S.threadProjectId, p = project(pid);
  if(!p) return closeThread();
  const msgs = S.messages.filter(m=>m.project_id===pid).sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
  let lastDay = "";
  const body = msgs.map(m=>{
    let sep = "";
    const dl = dayLabel(m.created_at);
    if(dl!==lastDay){ lastDay = dl; sep = `<div class="daysep">${esc(dl)}</div>`; }
    const mine = m.sender_id === S.me.id;
    return sep + `<div class="bub ${mine?'me':'them'}">${esc(m.content)}<div class="bt">${esc(fmtTime(m.created_at))}</div></div>`;
  }).join("") || `<div class="empty">No messages yet — say hello.</div>`;

  $("#thread").innerHTML = `
    <div class="th-head">
      <button class="icon-btn" onclick="closeThread()"><i class="ph-bold ph-arrow-left"></i></button>
      <div class="min0" style="display:flex;gap:10px;align-items:center;justify-content:space-between">
        <div class="min0">
          <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</div>
          <div style="font-size:11.5px;color:var(--muted)">${esc(ADMIN_NAME)}</div>
        </div>
        ${badge(p.status)}
      </div>
    </div>
    <div class="th-body" id="thBody">${body}</div>
    <div class="th-comp">
      <textarea id="thInput" class="field" rows="1" placeholder="Write a message…"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage(document.getElementById('thSend'))}"></textarea>
      <button id="thSend" class="btn" style="width:52px;padding:0;border-radius:99px" onclick="sendMessage(this)"><i class="ph-bold ph-paper-plane-right"></i></button>
    </div>`;
  const b = $("#thBody"); b.scrollTop = b.scrollHeight;
}
async function sendMessage(btn){
  const input = $("#thInput"); const content = input.value.trim();
  if(!content) return;
  input.value = ""; input.style.height = "auto";
  await withLoading(btn, async ()=>{
    const { error } = await sb.from("messages").insert({ project_id:S.threadProjectId, sender_id:S.me.id, content, read:false });
    if(error){ toast(error.message,"err"); input.value = content; return; }
    const { data } = await sb.from("messages").select("*").eq("project_id",S.threadProjectId).order("created_at",{ascending:true});
    S.messages = S.messages.filter(m=>m.project_id!==S.threadProjectId).concat(data||[]);
    renderThread();
  });
}

/* ============================================================
   SHEETS / MODALS (drag-dismiss on mobile, centered on desktop)
   ============================================================ */
const sheetEl = $("#sheet"), scrimEl = $("#scrim");
function openSheet(title, html, onMount){
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = html;
  scrimEl.classList.remove("hidden"); sheetEl.classList.remove("hidden");
  requestAnimationFrame(()=>{ scrimEl.classList.add("on"); sheetEl.classList.add("on"); });
  if(onMount) onMount();
}
function closeSheet(){
  sheetEl.style.transition = ""; sheetEl.style.transform = "";
  sheetEl.classList.remove("on"); scrimEl.classList.remove("on");
  setTimeout(()=>{ sheetEl.classList.add("hidden"); scrimEl.classList.add("hidden"); $("#sheetBody").innerHTML=""; }, 240);
}
/* pointer drag */
(function(){
  let startY=0, cur=0, dragging=false;
  const grab = $("#grab");
  grab.addEventListener("pointerdown", (e)=>{ dragging=true; startY=e.clientY; cur=0; sheetEl.style.transition="none"; });
  window.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    cur = Math.max(0, e.clientY - startY);
    sheetEl.style.transform = `translateY(${cur}px)`;
  });
  window.addEventListener("pointerup", (e)=>{
    if(!dragging) return; dragging=false;
    const vel = cur/Math.max(1,(e.timeStamp%100000));
    sheetEl.style.transition = "";
    if(cur > 110 || vel > 0.7) closeSheet();
    else sheetEl.style.transform = "";
    cur = 0;
  });
})();

async function submitQuote(btn){

  if(!description){ toast("Please describe your project briefly","err"); return; }

      client_id: S.me.id, project_type, budget_range, description, status:"pending",

    if(error){ toast(error.message,"err"); return; }
    closeSheet();

  });
}

/* ---------- Profile ---------- */
function openProfile(){
  const providers = (S.me.app_metadata && S.me.app_metadata.providers) || [];
  const identities = S.me.identities || [];
  const isEmail = providers.includes("email") || identities.some(i=>i.provider==="email") || (!providers.length && !identities.length);
  openSheet("Your Profile", `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:18px">
      <div class="av" style="width:52px;height:52px;font-size:18px;background:var(--accent);color:#fff">${esc(initials(S.profile.full_name))}</div>
      <div class="min0">
        <div style="font-weight:600;font-size:15px">${esc(S.profile.full_name||"Client")}</div>
        <div style="font-size:12px;color:var(--muted)">${esc(S.me.email||"")}</div>
      </div>
    </div>
    <div class="fgroup">
      <label class="lb">Full name</label>
      <input id="pfName" class="field" value="${esc(S.profile.full_name||"")}" placeholder="Your full name" />
    </div>
    <div class="fgroup">
      <label class="lb">Phone (optional)</label>
      <input id="pfPhone" class="field" type="tel" value="${esc(S.profile.phone||"")}" placeholder="e.g. 0803 123 4567" />
    </div>
    <button class="btn full" onclick="saveProfile(this)"><i class="ph-bold ph-floppy-disk"></i> Save changes</button>

    ${isEmail?`
    <div class="section-title">Security</div>
    <button class="btn ghost full" onclick="openChangePassword()"><i class="ph ph-key"></i> Change password</button>`:""}

    <div class="section-title">Account</div>
    <button class="btn ghost full" onclick="closeSheet();refresh();toast('Data refreshed')"><i class="ph ph-arrows-clockwise"></i> Refresh data</button>
    <button class="btn danger full" style="margin-top:10px" onclick="logout()"><i class="ph ph-sign-out"></i> Log Out</button>
  `);
}
async function saveProfile(btn){
  const full_name = $("#pfName").value.trim();
  const phone = $("#pfPhone").value.trim() || null;
  if(!full_name){ toast("Please enter your name","err"); return; }
  await withLoading(btn, async ()=>{
    const { error } = await sb.from("profiles").update({ full_name, phone }).eq("id", S.me.id);
    if(error){ toast(error.message,"err"); return; }
    S.profile.full_name = full_name; S.profile.phone = phone;
    $("#sideName").textContent = full_name; $("#sideAv").textContent = initials(full_name);
    closeSheet(); toast("Profile saved"); render();
  });
}
function openChangePassword(){
  openSheet("Change Password", `
    <div class="fgroup">
      <label class="lb">New password</label>
      <input id="pwNew" class="field" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
    </div>
    <div class="fgroup">
      <label class="lb">Confirm new password</label>
      <input id="pwConfirm" class="field" type="password" placeholder="Repeat it" autocomplete="new-password" />
    </div>
    <button class="btn full" onclick="changePassword(this)"><i class="ph-bold ph-key"></i> Update password</button>
  `);
}
async function changePassword(btn){
  const a = $("#pwNew").value, b = $("#pwConfirm").value;
  if(a.length < 6){ toast("Password must be at least 6 characters","err"); return; }
  if(a !== b){ toast("Passwords don't match","err"); return; }
  await withLoading(btn, async ()=>{
    const { error } = await sb.auth.updateUser({ password: a });
    if(error){ toast(error.message,"err"); return; }
    closeSheet(); toast("Password updated");
  });
}

boot();
</script>
