<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin Dashboard — MJ Web Solutions</title>
<meta name="description" content="Admin operations dashboard for MJ Web Solutions client portal." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<style>
:root{
  --bg:#FFFFFF;
  --bg-soft:#F8FAFC;
  --card:#FFFFFF;
  --text:#1a2030;
  --muted:#5a6478;
  --accent:#2563EB;
  --accent2:#1d4ed8;
  --accent-soft:rgba(37,99,235,0.10);
  --red:#EF4444;
  --green:#10B981;
  --amber:#F59E0B;
  --line:#E5E7EB;
  --shadow:0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg:0 12px 28px rgba(15,23,42,0.12);
  --radius:10px;
  --nav-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  background:var(--bg-soft);
  color:var(--text);
  font-size:14px;
  line-height:1.45;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
a{color:var(--accent);text-decoration:none}
.hidden{display:none !important}

/* ---------- Gate / loader ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200;flex-direction:column;gap:16px}
.dots{display:flex;gap:6px}
.dots span{width:8px;height:8px;border-radius:99px;background:var(--accent);animation:wave 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.1s}
.dots span:nth-child(3){animation-delay:.2s}
.dots span:nth-child(4){animation-delay:.3s}
.dots span:nth-child(5){animation-delay:.4s}
.dots.sm span{width:6px;height:6px;background:currentColor}
@keyframes wave{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}}
.gate-msg{color:var(--muted);font-size:13px}

/* ---------- Layout ---------- */
#app{min-height:100dvh}
.sidebar{display:none}
.main{padding:0 0 calc(var(--nav-h) + 28px);min-height:100dvh}

.screen-head{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:14px 16px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;
}
.screen-head h1{font-size:18px}
.screen-head .sub{font-size:11.5px;color:var(--muted)}
.pad{padding:16px}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px;display:flex;flex-direction:column;gap:6px}
.stat i{font-size:20px;color:var(--accent);background:var(--accent-soft);width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.stat .lbl{font-size:11.5px;color:var(--muted);line-height:1.3}
.stat .val{font-size:22px;font-weight:700;letter-spacing:-0.02em}
.stat .val small{font-size:12px;font-weight:500;color:var(--muted);display:block}

.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}

.list{display:flex;flex-direction:column;gap:10px}
.row{
  width:100%;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  gap:12px;align-items:center;padding:12px 14px;min-height:56px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
}
.row:active{background:var(--bg-soft)}
.row .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:18px;flex:none}
.row .t{font-size:13.5px;font-weight:500}
.row .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ts{font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
.min0{min-width:0}

.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.b-quote_sent,.b-pending{background:#F1F5F9;color:#64748B}
.b-approved,.b-partial{background:rgba(245,158,11,.14);color:#B45309}
.b-in_progress{background:var(--accent-soft);color:var(--accent)}
.b-delivered,.b-paid{background:rgba(16,185,129,.14);color:#047857}
.b-unpaid,.b-declined{background:rgba(239,68,68,.12);color:#B91C1C}

/* ---------- Controls ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 2px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;min-height:40px;display:inline-flex;align-items:center;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--muted);font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.field{width:100%;padding:12px 13px;min-height:46px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);outline:none;width:100%}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{min-height:88px;resize:vertical;line-height:1.5}
label.lb{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:0 0 6px}
.fgroup{margin-bottom:14px}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px}
.search-wrap .field{padding-left:38px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:var(--radius);
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;
  transition:background .15s,transform .1s;
}
.btn:hover{background:var(--accent2)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.7;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.danger{background:var(--red)}
.btn.sm{min-height:40px;font-size:13px;padding:0 14px}
.btn.full{width:100%}
.btn-row{display:flex;gap:12px}
.btn-row>*{flex:1}
.icon-btn{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;font-size:20px;color:var(--text)}
.icon-btn:hover{background:var(--bg-soft)}

.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + 26px);z-index:60;
  width:56px;height:56px;border-radius:99px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow-lg);
}

/* ---------- Bottom nav ---------- */
.bnav{
  position:fixed;left:14px;right:14px;bottom:14px;z-index:80;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(37,99,235,.18);border-radius:999px;box-shadow:var(--shadow-lg);
  padding:6px 4px;
}
.bnav button{
  min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);border-radius:999px;padding:4px 2px;
}
.bnav button i{font-size:20px}
.bnav button span{font-size:9.5px;font-weight:500;line-height:1.1;text-align:center}
.bnav button.on{color:var(--accent)}
.bnav button.on i{font-weight:700}

/* ---------- Screen transitions ---------- */
.screen{animation:fadeUp .18s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:120;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:130;
  background:var(--card);border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);
  max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  touch-action:none;
}
.sheet.on{transform:translateY(0)}
.sheet .grab{padding:10px 0 4px;display:grid;place-items:center;flex:none;cursor:grab}
.sheet .grab i{display:block;width:42px;height:5px;border-radius:99px;background:var(--line)}
.sheet .sh-head{padding:4px 18px 10px;flex:none}
.sheet .sh-head h3{font-size:16px}
.sheet .sh-body{padding:6px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}

/* ---------- Toast ---------- */
#toasts{position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + 30px);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:#111827;color:#fff;padding:12px 14px;border-radius:var(--radius);font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:center;animation:fadeUp .18s ease-out;
}
.toast.err{background:var(--red)}
.toast.ok i{color:#6EE7B7}

/* ---------- Project cards ---------- */
.pcard{display:block;width:100%;text-align:left;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pcard .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.pcard .nm{font-size:15px;font-weight:600;line-height:1.3}
.pcard .cl{font-size:12.5px;color:var(--muted);margin-top:2px}
.pcard .ft{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.pcard .amt{font-weight:600;color:var(--text);font-size:13px}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-26px;top:2px;width:20px;height:20px;border-radius:99px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.tl-item.done .tl-dot{border-color:var(--accent);background:var(--accent);color:#fff}
.tl-item.cur .tl-dot{border-color:var(--accent);color:var(--accent)}
.tl-item .tl-t{font-size:13.5px;font-weight:500}
.tl-item .tl-s{font-size:11.5px;color:var(--muted)}

.note-item{padding:11px 12px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius)}
.note-item .n-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center}
.hint{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-bottom:10px}
.hint i{color:var(--accent);font-size:14px;margin-top:1px}

/* ---------- Messages ---------- */
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;min-height:64px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.av{width:42px;height:42px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.dot{width:9px;height:9px;border-radius:99px;background:var(--accent)}
.unread-pill{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}

#thread{position:fixed;inset:0;z-index:100;background:var(--bg-soft);display:flex;flex-direction:column}
#thread .th-head{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#thread .th-body{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
#thread .th-comp{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);word-wrap:break-word}
.bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.bub .bt{font-size:10.5px;opacity:.7;margin-top:4px;text-align:right}
.daysep{align-self:center;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 11px;border-radius:99px;margin:8px 0}

.trunc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.linkish{color:var(--accent);font-size:12px;font-weight:500;padding:6px 0;min-height:32px}

/* ---------- Desktop ---------- */
@media (min-width:1024px){
  :root{--nav-h:0px}
  .bnav{display:none}
  .sidebar{
    display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;
    background:var(--card);border-right:1px solid var(--line);padding:20px 14px;z-index:70;
  }
  .sidebar .brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px}
  .sidebar .brand .lg{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
  .sidebar .brand b{font-size:14px}
  .sidebar .brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
  .sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1}
  .sidebar nav button{display:flex;align-items:center;gap:11px;min-height:46px;padding:0 12px;border-radius:var(--radius);color:var(--muted);font-size:13.5px;font-weight:500}
  .sidebar nav button i{font-size:19px}
  .sidebar nav button:hover{background:var(--bg-soft)}
  .sidebar nav button.on{background:var(--accent-soft);color:var(--accent)}
  .sidebar .who{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
  .sidebar .who .me{display:flex;gap:10px;align-items:center;padding:0 4px;min-width:0}
  .sidebar .who .me .nmm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar .who .me .rl{font-size:11px;color:var(--muted)}
  .main{margin-left:240px;padding-bottom:40px}
  .pad{padding:24px 28px;max-width:1180px}
  .screen-head{padding:18px 28px}
  .screen-head h1{font-size:22px}
  .stat-grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .fab{display:none}
  .chips{margin:0;padding:0}
  #toasts{left:auto;right:24px;bottom:24px;width:340px}
  .scrim{background:rgba(15,23,42,.5)}
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;width:min(520px,92vw);
    border-radius:16px;transform:translate(-50%,-46%) scale(.97);opacity:0;
    transition:opacity .18s ease,transform .18s ease;max-height:86vh;
  }
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .sheet .grab{display:none}
  .sheet .sh-head{padding:18px 22px 8px}
  .sheet .sh-body{padding:0 22px 22px}
  #thread{left:240px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
}
@media (min-width:1280px){
  #thread{position:static;height:auto}
}
</style>
</head>
<body>

<div id="gate">
  <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="gate-msg" id="gateMsg">Verifying your session…</div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="lg">MJ</div>
      <div><b>MJ Web Solutions</b><small>Admin console</small></div>
    </div>
    <nav id="sideNav"></nav>
    <div class="who">
      <div class="me">
        <div class="av" id="sideAv">A</div>
        <div class="min0"><div class="nmm" id="sideName">Admin</div><div class="rl">Administrator</div></div>
      </div>
      <button class="btn ghost sm full" onclick="logout()"><i class="ph ph-sign-out"></i> Log Out</button>
    </div>
  </aside>

  <main class="main" id="main"></main>

  <nav class="bnav" id="bnav"></nav>
  <button class="fab hidden" id="fab" onclick="openNewProject()"><i class="ph-bold ph-plus"></i></button>
</div>

<div id="thread" class="hidden"></div>
<div id="scrim" class="scrim hidden" onclick="closeSheet()"></div>
<div id="sheet" class="sheet hidden">
  <div class="grab" id="grab"><i></i></div>
  <div class="sh-head"><h3 id="sheetTitle"></h3></div>
  <div class="sh-body" id="sheetBody"></div>
</div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   MJ Web Solutions — Admin Dashboard
   ============================================================ */
const SUPABASE_URL = "https://tkhhwybtxyivizfulpxk.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRraGh3eWJ0eHlpdml6ZnVscHhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTQ2MjIsImV4cCI6MjEwMzE5MDYyMn0.r8V1qv3Vvf4RHjbQjpaN8RU1NdJWnfDI3sE0qHewAJU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const TABS = [
  { id:"overview", label:"Overview",  icon:"ph-squares-four" },
  { id:"clients",  label:"Clients",   icon:"ph-folders", long:"Clients & Projects" },
  { id:"messages", label:"Messages",  icon:"ph-chat-circle-dots" },
  { id:"quotes",   label:"Quotes",    icon:"ph-file-text", long:"Quote Requests" },
  { id:"invoices", label:"Invoices",  icon:"ph-receipt" },
];

const S = {
  me:null, profile:null,
  profiles:[], projects:[], quotes:[], invoices:[], messages:[], stages:[],
  tab:"overview", projectId:null, threadProjectId:null,
  pFilter:"all", pSearch:"", qFilter:"pending", iFilter:"all",
};

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = (v)=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n)=> "₦" + Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2});
const initials = (n)=> (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const labelize = (s)=> String(s||"").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
function timeAgo(iso){
  if(!iso) return "";
  const d = new Date(iso), s = (Date.now()-d.getTime())/1000;
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  if(s<604800) return Math.floor(s/86400)+"d ago";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
const fmtDate = (iso)=> iso ? new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
const fmtTime = (iso)=> iso ? new Date(iso).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}) : "";
function dayLabel(iso){
  const d=new Date(iso), t=new Date(), y=new Date(Date.now()-864e5);
  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,t)) return "Today";
  if(same(d,y)) return "Yesterday";
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
const badge = (st)=> `<span class="badge b-${esc(st)}">${esc(labelize(st))}</span>`;
const clientName = (id)=> (S.profiles.find(p=>p.id===id)?.full_name) || "Unknown client";
const project = (id)=> S.projects.find(p=>p.id===id);

function toast(msg, type="ok"){
  const el = document.createElement("div");
  el.className = "toast " + (type==="err"?"err":"ok");
  el.innerHTML = `<i class="ph-bold ${type==="err"?"ph-warning-circle":"ph-check-circle"}"></i><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .25s"; el.style.opacity="0"; setTimeout(()=>el.remove(),260); }, 2800);
}
function spinner(){ return `<span class="dots sm"><span></span><span></span><span></span><span></span><span></span></span>`; }
async function withLoading(btn, fn){
  if(!btn) return fn();
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = spinner();
  try { return await fn(); } finally { btn.disabled=false; btn.innerHTML=html; }
}

/* ============================================================
   AUTH GATE
   ============================================================ */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.replace("index.html"); return; }
  S.me = session.user;
  const { data:prof, error } = await sb.from("profiles").select("id,full_name,phone,role,created_at").eq("id", S.me.id).maybeSingle();
  if(error || !prof || prof.role !== "admin"){ location.replace("index.html"); return; }
  S.profile = prof;
  $("#gateMsg").textContent = "Loading dashboard…";
  await loadAll();
  $("#gate").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#sideName").textContent = prof.full_name || "Admin";
  $("#sideAv").textContent = initials(prof.full_name);
  renderNav();
  render();
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT") location.replace("index.html"); });
async function logout(){ await sb.auth.signOut(); location.replace("index.html"); }

async function loadAll(){
  const [profiles, projects, quotes, invoices, messages, stages] = await Promise.all([
    sb.from("profiles").select("id,full_name,phone,role,created_at").order("created_at",{ascending:false}),
    sb.from("projects").select("*").order("updated_at",{ascending:false}),
    sb.from("quote_requests").select("*").order("created_at",{ascending:false}),
    sb.from("invoices").select("*").order("created_at",{ascending:false}),
    sb.from("messages").select("*").order("created_at",{ascending:true}),
    sb.from("stage_updates").select("*").order("created_at",{ascending:false}),
  ]);
  const err = [profiles,projects,quotes,invoices,messages,stages].find(r=>r.error);
  if(err) toast(err.error.message,"err");
  S.profiles = profiles.data||[]; S.projects = projects.data||[]; S.quotes = quotes.data||[];
  S.invoices = invoices.data||[]; S.messages = messages.data||[]; S.stages = stages.data||[];
}
async function refresh(){ await loadAll(); render(); }

/* ============================================================
   NAV
   ============================================================ */
function renderNav(){
  $("#bnav").innerHTML = TABS.map(t=>`
    <button class="${S.tab===t.id?'on':''}" onclick="go('${t.id}')">
      <i class="ph ${t.icon}"></i><span>${esc(t.label)}</span>
    </button>`).join("");
  $("#sideNav").innerHTML = TABS.map(t=>`
    <button class="${S.tab===t.id?'on':''}" onclick="go('${t.id}')">
      <i class="ph ${t.icon}"></i><span>${esc(t.long||t.label)}</span>
    </button>`).join("");
}
function go(tab){ S.tab = tab; S.projectId = null; renderNav(); render(); window.scrollTo({top:0}); }
function openProject(id){ S.tab="clients"; S.projectId=id; renderNav(); render(); window.scrollTo({top:0}); }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const m = $("#main");
  $("#fab").classList.toggle("hidden", !(S.tab==="clients" && !S.projectId));
  if(S.tab==="overview") m.innerHTML = viewOverview();
  else if(S.tab==="clients") m.innerHTML = S.projectId ? viewProjectDetail() : viewClients();
  else if(S.tab==="messages") m.innerHTML = viewMessages();
  else if(S.tab==="quotes") m.innerHTML = viewQuotes();
  else if(S.tab==="invoices") m.innerHTML = viewInvoices();
}

function head(title, sub, right=""){
  return `<div class="screen-head">
    <div class="min0"><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>
    <div style="display:flex;gap:8px;align-items:center">${right}</div>
  </div>`;
}

/* ---------- Screen 1: Overview ---------- */
function viewOverview(){
  const activeClients = new Set(S.projects.filter(p=>p.status!=="delivered").map(p=>p.client_id)).size;
  const pendingQuotes = S.quotes.filter(q=>q.status==="pending").length;
  const inProgress = S.projects.filter(p=>p.status==="in_progress").length;
  const unpaid = S.invoices.filter(i=>i.payment_status!=="paid");
  const unpaidTotal = unpaid.reduce((s,i)=>s+Number(i.amount||0),0);

  const acts = [];
  S.quotes.forEach(q=>acts.push({t:q.created_at,ic:"ph-file-text",title:"New quote request",sub:`${clientName(q.client_id)} · ${q.project_type}`,go:`go('quotes')`}));
  S.messages.filter(m=>m.sender_id!==S.me.id && !m.read).forEach(m=>{
    const p=project(m.project_id);
    acts.push({t:m.created_at,ic:"ph-chat-circle-dots",title:"Unread client message",sub:`${p?clientName(p.client_id):"—"} · ${p?p.name:"—"}`,go:`openThread('${m.project_id}')`});
  });
  S.stages.forEach(s=>{ const p=project(s.project_id);
    acts.push({t:s.created_at,ic:"ph-flag",title:`Stage update · ${labelize(s.stage)}`,sub:`${p?p.name:"—"} — ${String(s.note||"").slice(0,60)}`,go:`openProject('${s.project_id}')`});});
  S.invoices.filter(i=>i.payment_status==="paid").forEach(i=>{ const p=project(i.project_id);
    acts.push({t:i.created_at,ic:"ph-check-circle",title:`Invoice paid · ${money(i.amount)}`,sub:`${p?p.name:"—"} · ${i.description||""}`,go:`openProject('${i.project_id}')`});});
  acts.sort((a,b)=> new Date(b.t)-new Date(a.t));

  return `${head("Overview", `Hi ${S.profile.full_name||"Admin"} — here's today`, `
    <button class="icon-btn" onclick="openAccountSheet()" aria-label="Account"><i class="ph ph-user-circle"></i></button>`)}
  <div class="pad screen">
    <div class="stat-grid">
      ${stat("ph-users-three","Active clients",activeClients)}
      ${stat("ph-file-text","Pending quotes",pendingQuotes)}
      ${stat("ph-hammer","In progress",inProgress)}
      ${stat("ph-receipt","Unpaid invoices",unpaid.length,money(unpaidTotal))}
    </div>
    <div class="section-title">Recent activity</div>
    <div class="list">
      ${acts.length?acts.slice(0,25).map(a=>`
        <button class="row" onclick="${a.go}">
          <span class="ico"><i class="ph ${a.ic}"></i></span>
          <span class="min0"><span class="t" style="display:block">${esc(a.title)}</span><span class="s" style="display:block">${esc(a.sub)}</span></span>
          <span class="ts">${esc(timeAgo(a.t))}</span>
        </button>`).join(""):`<div class="empty">No activity yet.</div>`}
    </div>
  </div>`;
}
function stat(icon,label,val,sub){
  return `<div class="card stat"><i class="ph ${icon}"></i>
    <span class="lbl">${esc(label)}</span>
    <span class="val">${esc(val)}${sub?`<small>${esc(sub)}</small>`:""}</span></div>`;
}

async function setProjectStatus(id, status){
  const { error } = await sb.from("projects").update({ status, updated_at:new Date().toISOString() }).eq("id",id);
  if(error) return toast(error.message,"err");
  toast("Status updated to " + labelize(status));
  await refresh();
}
async function saveProjectMeta(ev,id){
  const amt = $("#pAmt").value, notes = $("#pNotes").value;
  await withLoading(ev.currentTarget, async ()=>{
    const { error } = await sb.from("projects").update({ quote_amount:Number(amt||0), notes, updated_at:new Date().toISOString() }).eq("id",id);
    if(error) return toast(error.message,"err");
    toast("Project saved");
    await refresh();
  });
}
async function addStageUpdate(ev,pid,stage){
  const note = $("#stageNote").value.trim();
  if(!note) return toast("Write an update first","err");
  await withLoading(ev.currentTarget, async ()=>{
    const { error } = await sb.from("stage_updates").insert({ project_id:pid, stage, note });
    if(error) return toast(error.message,"err");
    toast("Update posted to client");
    await refresh();
  });
}
async function setInvoiceStatus(id,payment_status){
  const { error } = await sb.from("invoices").update({ payment_status }).eq("id",id);
  if(error) return toast(error.message,"err");
  toast("Invoice marked " + labelize(payment_status));
  await refresh();
}

/* ---------- Screen 3: Messages ---------- */
function conversations(){
  const map = new Map();
  S.messages.forEach(m=>{
    const c = map.get(m.project_id) || { project_id:m.project_id, last:null, unread:0 };
    c.last = m;
    if(m.sender_id !== S.me.id && !m.read) c.unread++;
    map.set(m.project_id, c);
  });
  return [...map.values()].filter(c=>project(c.project_id)).sort((a,b)=> new Date(b.last.created_at)-new Date(a.last.created_at));
}
function viewMessages(){
  const convs = conversations();
  return `${head("Messages", `${convs.reduce((s,c)=>s+c.unread,0)} unread`)}
  <div class="pad screen">
    <div class="list">
      ${convs.length?convs.map(c=>{
        const p = project(c.project_id), cn = clientName(p.client_id);
        return `<button class="mrow" onclick="openThread('${c.project_id}')">
          <span class="av">${esc(initials(cn))}</span>
          <span class="min0">
            <span style="display:flex;gap:8px;justify-content:space-between"><span class="t" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(cn)}</span><span class="ts">${esc(timeAgo(c.last.created_at))}</span></span>
            <span class="s" style="display:block">${esc(p.name)}</span>
            <span class="s" style="display:block">${c.last.sender_id===S.me.id?"You: ":""}${esc(c.last.content)}</span>
          </span>
          ${c.unread?`<span class="unread-pill">${c.unread}</span>`:`<span></span>`}
        </button>`;}).join(""):`<div class="empty">No conversations yet.</div>`}
    </div>
    <div class="section-title">Start a conversation</div>
    <div class="list">
      ${S.projects.filter(p=>!convs.some(c=>c.project_id===p.id)).map(p=>`
        <button class="row" onclick="openThread('${p.id}')">
          <span class="ico"><i class="ph ph-chat-circle"></i></span>
          <span class="min0"><span class="t" style="display:block">${esc(p.name)}</span><span class="s" style="display:block">${esc(clientName(p.client_id))}</span></span>
          <span class="ts"><i class="ph ph-caret-right"></i></span>
        </button>`).join("") || `<div class="empty">All projects have threads.</div>`}

  </div>`;
}

async function openThread(pid){
  S.threadProjectId = pid;
  $("#bnav").classList.add("hidden");
  $("#fab").classList.add("hidden");
  $("#thread").classList.remove("hidden");
  renderThread();
  const unread = S.messages.filter(m=>m.project_id===pid && m.sender_id!==S.me.id && !m.read).map(m=>m.id);
  if(unread.length){
    await sb.from("messages").update({ read:true }).in("id", unread);
    S.messages.forEach(m=>{ if(unread.includes(m.id)) m.read = true; });
  }
}
function closeThread(){
  S.threadProjectId = null;
  $("#thread").classList.add("hidden");
  $("#bnav").classList.remove("hidden");
  render();
}
function renderThread(){
  const pid = S.threadProjectId, p = project(pid);
  if(!p) return closeThread();
  const msgs = S.messages.filter(m=>m.project_id===pid).sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
  let lastDay = "";
  const body = msgs.map(m=>{
    let sep = "";
    const dl = dayLabel(m.created_at);
    if(dl!==lastDay){ lastDay = dl; sep = `<div class="daysep">${esc(dl)}</div>`; }
    const mine = m.sender_id === S.me.id;
    return sep + `<div class="bub ${mine?'me':'them'}">${esc(m.content)}<div class="bt">${esc(fmtTime(m.created_at))}</div></div>`;
  }).join("") || `<div class="empty">No messages yet — say hello.</div>`;

  $("#thread").innerHTML = `
    <div class="th-head">
      <button class="icon-btn" onclick="closeThread()"><i class="ph-bold ph-arrow-left"></i></button>
      <div class="min0" style="display:flex;gap:10px;align-items:center">
        <div class="av" style="width:36px;height:36px;font-size:13px">${esc(initials(clientName(p.client_id)))}</div>
        <div class="min0">
          <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(clientName(p.client_id))}</div>
          <div style="font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</div>
        </div>
      </div>
    </div>
    <div class="th-body" id="thBody">${body}</div>
    <div class="th-comp">
      <input id="thInput" class="field" placeholder="Write a message…" onkeydown="if(event.key==='Enter'){event.preventDefault();sendMessage(document.getElementById('thSend'))}" />
      <button id="thSend" class="btn" style="width:56px;padding:0" onclick="sendMessage(this)"><i class="ph-bold ph-paper-plane-right"></i></button>
    </div>`;
  const b = $("#thBody"); b.scrollTop = b.scrollHeight;
}
async function sendMessage(btn){
  const input = $("#thInput"); const content = input.value.trim();
  if(!content) return;
  input.value = "";
  await withLoading(btn, async ()=>{
    const { error } = await sb.from("messages").insert({ project_id:S.threadProjectId, sender_id:S.me.id, content, read:false });
    if(error){ toast(error.message,"err"); input.value = content; return; }
    const { data } = await sb.from("messages").select("*").eq("project_id",S.threadProjectId).order("created_at",{ascending:true});
    S.messages = S.messages.filter(m=>m.project_id!==S.threadProjectId).concat(data||[]);
    renderThread();
  });
}

/* ---------- Screen 5: Invoices ---------- */
function viewInvoices(){
  const list = S.invoices.filter(i=> S.iFilter==="all" ? true : i.payment_status===S.iFilter);
  const total = list.reduce((s,i)=>s+Number(i.amount||0),0);
  return `${head("Invoices", `${list.length} invoice${list.length===1?"":"s"} · ${money(total)}`)}
  <div class="pad screen">
    <div class="fgroup">
      <select class="field" onchange="S.iFilter=this.value;render()">
        ${["all","unpaid","partial","paid"].map(s=>`<option value="${s}" ${S.iFilter===s?"selected":""}>${esc(s==="all"?"All statuses":labelize(s))}</option>`).join("")}
      </select>
    </div>
    <div class="list">
      ${list.length?list.map(i=>{
        const p = project(i.project_id);
        return `<button class="card" style="padding:14px;text-align:left;width:100%" onclick="${p?`openProject('${p.id}')`:""}">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start">
            <div class="min0">
              <div style="font-weight:600">${esc(p?clientName(p.client_id):"Unknown")}</div>
              <div style="font-size:12.5px;color:var(--muted)">${esc(p?p.name:"—")} · ${esc(i.description||"Invoice")}</div>
            </div>
            ${badge(i.payment_status)}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px">
            <div style="font-size:20px;font-weight:700">${esc(money(i.amount))}</div>
            <div style="font-size:11.5px;color:var(--muted)">${esc(fmtDate(i.created_at))}</div>
          </div>
        </button>`;}).join(""):`<div class="empty">No invoices match this filter.</div>`}
    </div>
  </div>`;
}

/* ============================================================
   SHEETS / MODALS (drag-dismiss on mobile, centered on desktop)
   ============================================================ */
const sheetEl = $("#sheet"), scrimEl = $("#scrim");
function openSheet(title, html, onMount){
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = html;
  scrimEl.classList.remove("hidden"); sheetEl.classList.remove("hidden");
  requestAnimationFrame(()=>{ scrimEl.classList.add("on"); sheetEl.classList.add("on"); });
  if(onMount) onMount();
}
function closeSheet(){
  sheetEl.style.transition = ""; sheetEl.style.transform = "";
  sheetEl.classList.remove("on"); scrimEl.classList.remove("on");
  setTimeout(()=>{ sheetEl.classList.add("hidden"); scrimEl.classList.add("hidden"); $("#sheetBody").innerHTML=""; }, 240);
}
/* pointer drag */
(function(){
  let startY=0, cur=0, dragging=false, t0=0;
  const isMobile = ()=> window.matchMedia("(max-width:1023px)").matches;
  function down(e){
    if(!isMobile()) return;
    if(e.target.closest("input,textarea,select,button") && !e.target.closest("#grab")) return;
    const body = $("#sheetBody");
    if(!e.target.closest("#grab") && body.scrollTop > 0) return;
    dragging=true; startY=e.clientY; cur=0; t0=Date.now();
    sheetEl.style.transition="none"; sheetEl.setPointerCapture?.(e.pointerId);
  }
  function move(e){
    if(!dragging) return;
    cur = Math.max(0, e.clientY - startY);
    sheetEl.style.transform = `translateY(${cur}px)`;
  }
  function up(){
    if(!dragging) return; dragging=false;
    const vel = cur / Math.max(1, Date.now()-t0);
    sheetEl.style.transition = "transform .26s cubic-bezier(.32,.72,0,1)";
    if(cur > 110 || vel > 0.7) closeSheet();
    else sheetEl.style.transform = "translateY(0)";
  }
  sheetEl.addEventListener("pointerdown", down);
  sheetEl.addEventListener("pointermove", move);
  sheetEl.addEventListener("pointerup", up);
  sheetEl.addEventListener("pointercancel", up);
})();

function openAccountSheet(){
  openSheet("Account", `
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
      <div class="av">${esc(initials(S.profile.full_name))}</div>
      <div class="min0">
        <div style="font-weight:600">${esc(S.profile.full_name||"Admin")}</div>
        <div style="font-size:12px;color:var(--muted)">${esc(S.me.email||"")}</div>
      </div>
    </div>
    <button class="btn ghost full" onclick="closeSheet();refresh();toast('Data refreshed')"><i class="ph ph-arrows-clockwise"></i> Refresh data</button>
    <button class="btn danger full" style="margin-top:12px" onclick="logout()"><i class="ph ph-sign-out"></i> Log Out</button>`);
}

/* ---------- New project ---------- */
function openNewProject(){
  const clients = S.profiles.filter(p=>p.role==="client");
  openSheet("New Project", `
    <div class="fgroup">
      <label class="lb">Client</label>
      <select id="npClient" class="field" onchange="document.getElementById('npNewWrap').classList.toggle('hidden', this.value!=='__new')">
        ${clients.map(c=>`<option value="${c.id}">${esc(c.full_name||"Unnamed")}</option>`).join("")}
        <option value="__new">+ New client…</option>
      </select>
    </div>
    <div id="npNewWrap" class="${clients.length?'hidden':''}">
      <div class="fgroup"><label class="lb">New client full name</label><input id="npClientName" class="field" placeholder="e.g. Aisha Bello" /></div>
      <div class="fgroup"><label class="lb">Phone (optional)</label><input id="npClientPhone" class="field" placeholder="+234…" /></div>
      <div class="hint"><i class="ph-bold ph-info"></i><span>A profile record is created for this client. They'll be linked once they sign up with a matching account.</span></div>
    </div>
    <div class="fgroup"><label class="lb">Project name</label><input id="npName" class="field" placeholder="e.g. Bauchi Clinic Website" /></div>
    <div class="fgroup"><label class="lb">Initial status</label>
      <select id="npStatus" class="field">${P_STATUSES.map(s=>`<option value="${s}">${esc(labelize(s))}</option>`).join("")}</select>
    </div>
    <div class="fgroup"><label class="lb">Quote amount (₦)</label><input id="npAmt" class="field" type="number" step="0.01" value="0" /></div>
    <div class="fgroup"><label class="lb">Notes</label><textarea id="npNotes" class="field" placeholder="Internal notes…"></textarea></div>
    <button class="btn full" onclick="createProject(event)"><i class="ph-bold ph-check"></i> Create project</button>`,
    ()=>{ if(!clients.length) $("#npClient").value="__new"; });
}
async function createProject(ev){
  const name = $("#npName").value.trim();
  if(!name) return toast("Project name is required","err");
  let clientId = $("#npClient").value;
  await withLoading(ev.currentTarget, async ()=>{
    if(clientId === "__new"){
      const full_name = $("#npClientName").value.trim();
      if(!full_name) return toast("Enter the new client's name","err");
      const phone = $("#npClientPhone").value.trim() || null;
      const { data, error } = await sb.from("profiles").insert({ full_name, phone, role:"client" }).select("id").single();
      if(error) return toast(error.message,"err");
      clientId = data.id;
    }
    const { error } = await sb.from("projects").insert({
      client_id: clientId, name, status: $("#npStatus").value,
      quote_amount: Number($("#npAmt").value||0), notes: $("#npNotes").value.trim() || null,
    });
    if(error) return toast(error.message,"err");
    closeSheet(); toast("Project created"); await refresh();
  });
}

/* ---------- Add invoice ---------- */
function openAddInvoice(pid){
  openSheet("Add Invoice", `
    <div class="fgroup"><label class="lb">Description</label><input id="ivDesc" class="field" placeholder="e.g. Deposit" /></div>
    <div class="fgroup"><label class="lb">Amount (₦)</label><input id="ivAmt" class="field" type="number" step="0.01" placeholder="0.00" /></div>
    <div class="hint"><i class="ph-bold ph-info"></i><span>Created as <b>unpaid</b>. PDF generation isn't part of this build.</span></div>
    <button class="btn full" onclick="createInvoice(event,'${pid}')"><i class="ph-bold ph-check"></i> Add invoice</button>`);
}
async function createInvoice(ev,pid){
  const description = $("#ivDesc").value.trim(), amount = Number($("#ivAmt").value||0);
  if(!description) return toast("Add a description","err");
  if(!(amount>0)) return toast("Enter a valid amount","err");
  await withLoading(ev.currentTarget, async ()=>{
    const { error } = await sb.from("invoices").insert({ project_id:pid, description, amount, payment_status:"unpaid" });
    if(error) return toast(error.message,"err");
    closeSheet(); toast("Invoice added"); await refresh();
  });
}

/* ---------- Approve / decline quote ---------- */
function openApprove(qid){
  const q = S.quotes.find(x=>x.id===qid);
  openSheet("Approve Quote Request", `
    <div class="hint"><i class="ph-bold ph-user"></i><span>${esc(clientName(q.client_id))} · ${esc(q.project_type)}</span></div>
    <div class="fgroup"><label class="lb">Project name</label><input id="apName" class="field" value="${esc(q.project_type||"")}" /></div>
    <div class="fgroup"><label class="lb">Quote amount (₦)</label><input id="apAmt" class="field" type="number" step="0.01" placeholder="0.00" /></div>
    <button class="btn full" onclick="approveQuote(event,'${qid}')"><i class="ph-bold ph-check"></i> Approve & create project</button>`);
}
async function approveQuote(ev,qid){
  const q = S.quotes.find(x=>x.id===qid);
  const name = $("#apName").value.trim(), amount = Number($("#apAmt").value||0);
  if(!name) return toast("Project name is required","err");
  if(!(amount>0)) return toast("Enter a quote amount","err");
  await withLoading(ev.currentTarget, async ()=>{
    const { error } = await sb.from("projects").insert({
      client_id:q.client_id, quote_request_id:q.id, name, status:"quote_sent", quote_amount:amount,
    });
    if(error) return toast(error.message,"err");
    const { error:e2 } = await sb.from("quote_requests").update({ status:"approved" }).eq("id",qid);
    if(e2) return toast(e2.message,"err");
    closeSheet(); toast("Approved — project created"); await refresh();
  });
}
function openDecline(qid){
  const q = S.quotes.find(x=>x.id===qid);
  openSheet("Decline this request?", `
    <p style="font-size:13.5px;color:var(--muted);margin:0 0 16px">
      ${esc(clientName(q.client_id))}'s request for <b>${esc(q.project_type)}</b> will be marked as declined. This can't be undone from here.
    </p>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
      <button class="btn danger" onclick="declineQuote(event,'${qid}')">Decline</button>
    </div>`);
}
async function declineQuote(ev,qid){
  await withLoading(ev.currentTarget, async ()=>{
    const { error } = await sb.from("quote_requests").update({ status:"declined" }).eq("id",qid);
    if(error) return toast(error.message,"err");
    closeSheet(); toast("Request declined"); await refresh();
  });
}

/* desktop inline "New Project" button visibility */
function syncDesktopBtn(){
  const b = document.getElementById("dtNew");
  if(b) b.style.display = window.matchMedia("(min-width:1024px)").matches ? "inline-flex" : "none";
}
const _render = render;
render = function(){ _render(); syncDesktopBtn(); };
window.addEventListener("resize", syncDesktopBtn);

boot();
</script>
